name: Optimize Amenia portfolio images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-amenia-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Convert case study to WebP
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Path("assets/projects/web projects/Amenia/Amenia Case Study1-compressed.jpg")
          target=source.with_name("Amenia Case Study1-optimized.webp")
          with Image.open(source) as image:
              image=Image.Image.convert(image, "RGB")
              image.save(target,"WEBP",quality=78,method=6)
          print(f"Old {source.stat().st_size:,} bytes; new {target.stat().st_size:,} bytes")
          PY
      - name: Commit optimized asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/projects/web projects/Amenia/Amenia Case Study1-optimized.webp"
          if ! git diff --cached --quiet; then
            git commit -m "Optimize Amenia full case study image"
            git push
          fi
